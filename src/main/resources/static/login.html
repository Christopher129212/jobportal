<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }
        .login-card h2 {
            font-weight: 700;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-card .btn-primary {
            background: #0d6efd;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 50px;
        }
        .login-card .btn-primary:hover {
            background: #0a58ca;
        }
        .login-card a {
            color: #0d6efd;
            text-decoration: none;
        }
        .login-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2><i class="fas fa-sign-in-alt me-2"></i>Login</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
    // =============================================================
    //  🔑 SET YOUR DEPLOYED API URL HERE
    // =============================================================
    const API_BASE_URL = 'https://jobportal-1-jw11.onrender.com';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch(`${API_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('fullName', data.fullName);
                    if (data.role === 'ADMIN') {
                        window.location.href = `${API_BASE_URL}/admin-dashboard.html`;
                    } else {
                        window.location.href = `${API_BASE_URL}/dashboard.html`;
                    }
                }
            })
            .catch(err => {
                alert('Login failed: ' + err.message);
                console.error(err);
            });
    });
</script>
</body>
</html>
