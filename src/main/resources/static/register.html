<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #28a745, #20c997); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background: #fff; border-radius: 20px; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 480px; }
        .register-card h2 { font-weight: 700; color: #28a745; text-align: center; margin-bottom: 1.5rem; }
        .register-card .btn-success { background: #28a745; border: none; padding: 0.75rem; font-weight: 600; border-radius: 50px; }
        .register-card .btn-success:hover { background: #218838; }
        .register-card a { color: #28a745; text-decoration: none; }
        .register-card a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="register-card">
    <h2><i class="fas fa-user-plus me-2"></i>Register</h2>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Create a password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="role" class="form-select" required>
                <option value="JOB_SEEKER">Job Seeker</option>
                <option value="EMPLOYER">Employer</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
</div>
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };
        fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user)
        })
            .then(res => res.json())
            .then(data => {
                if (data.error) alert(data.error);
                else {
                    alert('Registration successful! Please login.');
                    window.location.href = 'login.html';
                }
            })
            .catch(err => alert('Registration failed'));
    });
</script>
</body>
</html>
